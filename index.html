<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>student dashboard</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</head>
<body>
  <header>
      <h1 class="space">STUDENT DASHBOARD</h1>
<button class="theme-switch">
  <ion-icon name="moon-outline" class="dark"></ion-icon>
  <ion-icon name="sunny" class="light"></ion-icon>
</button>
  </header>
  <main>
  <div class="counter">
    <p >Counter</p>
    <p class="counter-content">0</p>
    <p>
      <button class="counter-minus">-</button>
      <button class="counter-reset">Reset</button>
      <button class="counter-plus">+</button>
    </p>
  </div>

  <div class="users-container">
    <h2>Users</h2>
    <button class="userBtn">Load users</button>
    <p class="spin">Loading...</p>
    <div class="users">

</div>

  </div>
  
  </main>
  <script src="script.js"></script>
</body>
</html>
